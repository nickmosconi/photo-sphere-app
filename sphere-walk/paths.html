<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sphere Walk · Paths</title>
  <link rel="stylesheet" href="../css/style.css?v=0.9.0">
  <link rel="stylesheet" href="css/walk.css?v=0.3.0">
</head>
<body>
  <section class="screen">
    <div class="screen-inner">
      <h1>Paths</h1>
      <p class="tip">
        A path is several spheres captured a few steps apart, for example along a hallway into a room.
        Between spheres the app asks you to walk and records how many steps and which way.
      </p>
      <button id="new-path" class="big-button" type="button">New path</button>
      <p id="paths-error" class="error"></p>
      <div id="path-list"></div>
      <p><a href="index.html?v=0.3.0">← Sphere Walk</a></p>
    </div>
  </section>
  <script type="module" src="js/paths.js?v=0.3.0"></script>
</body>
</html>
